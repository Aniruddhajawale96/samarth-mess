name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment environment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$JWT_SECRET"
          test -n "$COOKIE_SECRET"
          cat > .env <<EOF
          NODE_ENV=production
          DATABASE_URL=$DATABASE_URL
          JWT_SECRET=$JWT_SECRET
          COOKIE_SECRET=$COOKIE_SECRET
          FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
          API_URL=${API_URL:-http://localhost:4000}
          REDIS_URL=redis://redis:6379
          PORT=4000
          EOF

      - name: Build containers
        run: docker compose build

      - name: Start dependencies
        run: docker compose up -d postgres redis

      - name: Run database migrations
        run: docker compose run --rm migrate

      - name: Start application
        run: docker compose up -d api worker web

      - name: Health check
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:4000/health && exit 0
            sleep 2
          done
          docker compose logs --no-color api worker
          exit 1

      - name: Deployment summary
        run: docker compose ps
