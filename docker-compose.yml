services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      # Inside the compose network the database/redis are reached by service name.
      # Values from .env (or the shell) win when present.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/samarth_mess}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    command: ["node", "apps/api/dist/index.js"]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/samarth_mess}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["pnpm", "--filter", "@samarth-mess/db", "db:migrate"]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/samarth_mess}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "apps/api/dist/worker.js"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time value; baked into the standalone server for server-side API
        # calls. Defaults to the compose `api` service, NOT localhost (which would
        # be the web container itself).
        NEXT_PUBLIC_API_URL: ${WEB_API_URL:-http://api:4000}
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${WEB_API_URL:-http://api:4000}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"

  postgres:
    image: postgres:16-alpine
    container_name: samarth_mess_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: samarth_mess
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samarth_mess"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: samarth_mess_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
