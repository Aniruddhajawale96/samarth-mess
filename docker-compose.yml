services:
  postgres:
    image: postgres:16-alpine
    container_name: samarth_mess_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: samarth_mess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samarth_mess"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
